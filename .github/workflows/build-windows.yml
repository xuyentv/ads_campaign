name: Build Windows EXE

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer and portable EXE
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AdForge-AI-Windows-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 30

      - name: Publish or update latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AdForge AI - Latest
          body: |
            Bản Windows mới nhất được tự động tạo từ nhánh main.

            - **Setup**: bản cài đặt Windows.
            - **Portable**: chạy trực tiếp, không cần cài đặt.
            - Commit: ${{ github.sha }}
          files: dist/*.exe
          prerelease: false
          draft: false
          make_latest: true
          overwrite_files: true

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
